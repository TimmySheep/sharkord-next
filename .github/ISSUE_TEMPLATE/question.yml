name: Question
description: Ask about Cove, the unofficial compatible client for Sharkord.
title: "[Question]: "
labels: ["question"]
assignees: []

body:
  - type: markdown
    attributes:
      value: |
        Please search for existing questions before submitting a new one. It's possible your question has already been answered in the documentation or in a previous issue.

        For Cove scope and contribution questions, read this repository's README and CONTRIBUTING.md.
        For Sharkord server setup, check [upstream documentation](https://sharkord.com/docs/common-questions).

  - type: textarea
    id: question
    attributes:
      label: Your Question
      description: Describe what you are trying to do and what is unclear.
      placeholder: Ask your question here.
    validations:
      required: true
