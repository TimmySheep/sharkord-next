name: Cove Bug Report
description: Identify a Cove client problem with reproducible evidence.
title: '[Bug]: '
body:
- type: markdown
  attributes:
    value: 'Cove is an unofficial compatible client for Sharkord. Search existing Issues first. Current
      focus: Android, iOS and Apple Watch; native desktop work is deferred. Redact tokens, private messages
      and personal information.'
- type: dropdown
  id: platform
  attributes:
    label: Affected platform
    options:
    - Android
    - iOS / iPadOS
    - Apple Watch / watchOS
    - Windows native (deferred)
    - macOS native (deferred)
    - Documentation / shared compatibility
    - Other
  validations:
    required: true
- type: input
  id: client-version
  attributes:
    label: Cove version or commit
  validations:
    required: true
- type: input
  id: server-version
  attributes:
    label: Sharkord server version
    description: Use an exact version or commit, not latest; write unknown if unavailable.
  validations:
    required: true
- type: textarea
  id: environment
  attributes:
    label: Device, OS and network context
    description: Include server deployment or browser comparison only where relevant.
  validations:
    required: true
- type: textarea
  id: steps
  attributes:
    label: Steps to reproduce
  validations:
    required: true
- type: textarea
  id: expected
  attributes:
    label: Expected behaviour
  validations:
    required: true
- type: textarea
  id: actual
  attributes:
    label: Actual behaviour
  validations:
    required: true
- type: textarea
  id: logs
  attributes:
    label: Redacted logs / screenshots
    description: Never include owner tokens, session tokens or private messages.
  validations:
    required: false
- type: textarea
  id: scope
  attributes:
    label: Suspected module / proposed fix
    description: 'Optional: explain where you think the problem is and whether you want to contribute.'
  validations:
    required: false
